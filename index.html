<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WGLT Budget Boss Jr</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display:flex; align-items:center; justify-content:center;
      font-family: Arial, sans-serif; color:#fff;
      background: linear-gradient(135deg,#0b1220,#12243a 45%,#193d2f 100%);
    }
    .card {
      width:min(92vw,720px); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
      border-radius:24px; padding:32px 24px; box-shadow:0 18px 50px rgba(0,0,0,.35); text-align:center;
      backdrop-filter: blur(8px);
    }
    h1 { margin:0 0 10px; font-size: clamp(2rem, 5vw, 3.2rem); }
    p { margin:0 0 28px; color:#d9e6f2; font-size:1.05rem; }
    .btns { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
    a.btn {
      display:block; padding:18px 20px; border-radius:18px; text-decoration:none; color:#fff; font-weight:700;
      box-shadow:0 10px 24px rgba(0,0,0,.25); transition:transform .15s ease, box-shadow .15s ease;
    }
    a.btn:hover { transform: translateY(-2px); box-shadow:0 14px 28px rgba(0,0,0,.32); }
    .student { background: linear-gradient(135deg,#16a34a,#22c55e); }
    .teacher { background: linear-gradient(135deg,#ca8a04,#facc15); color:#17202a; }
    .note { margin-top:20px; font-size:.95rem; color:#bfd0df; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💸 WGLT Budget Boss Jr.</h1>
    <p>Jr-only launcher with just the two modes you asked for.</p>
    <div class="btns">
      <a class="btn student" href="budget-boss-jr.html?teacher=0&mode=student-jr">🎒 Student Jr.</a>
      <a class="btn teacher" href="budget-boss-jr.html?teacher=1&mode=teacher-jr">🧑🏾‍🏫 Teacher Jr.</a>
    </div>
    <div class="note">All supporting JSON/data and JS files are included in this folder.</div>
  </div>
</body>
</html>
